<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPCore Tools Registry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1117;
            color: #e5e7eb;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: #13151f;
            border-bottom: 1px solid #2a2d3e;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }

        .header .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        /* Container */
        .container {
            display: flex;
            min-height: calc(100vh - 80px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1a1d2e;
            border-right: 1px solid #2a2d3e;
            padding: 1.5rem;
            overflow-y: auto;
            height: calc(100vh - 80px);
            position: sticky;
            top: 80px;
        }

        .sidebar h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .filter-section {
            margin-bottom: 2rem;
        }

        .filter-section label {
            display: block;
            font-size: 0.875rem;
            color: #d1d5db;
            margin-bottom: 0.5rem;
        }

        .filter-section input,
        .filter-section select {
            width: 100%;
            padding: 0.5rem;
            background: #13151f;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #e5e7eb;
            font-size: 0.875rem;
        }

        .filter-section input:focus,
        .filter-section select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tag-chip {
            padding: 0.25rem 0.75rem;
            background: #374151;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag-chip:hover {
            background: #4b5563;
        }

        .tag-chip.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: #1a1d2e;
            border-radius: 8px;
        }

        .stats-bar #toolCount {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .stats-bar .export-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-secondary {
            padding: 0.5rem 1rem;
            background: #374151;
            color: #e5e7eb;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        /* Tool Grid */
        #toolGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .tool-card {
            background: #1a1d2e;
            border: 1px solid #2a2d3e;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .tool-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }

        .tool-card h3 {
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            color: #f3f4f6;
        }

        .tool-type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #374151;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .category-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .tool-description {
            color: #d1d5db;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .tool-tag {
            padding: 0.2rem 0.6rem;
            background: #2a2d3e;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .tool-link {
            display: inline-block;
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .tool-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .tool-screenshot {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 1rem;
        }

        .tool-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2a2d3e;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-working { background: #10b981; color: white; }
        .status-untested { background: #6b7280; color: white; }
        .status-broken { background: #ef4444; color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1d2e;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: #f3f4f6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #d1d5db;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #13151f;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #e5e7eb;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .form-buttons button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit {
            background: #3b82f6;
            color: white;
        }

        .btn-submit:hover {
            background: #2563eb;
        }

        .btn-cancel {
            background: #374151;
            color: #e5e7eb;
        }

        .btn-cancel:hover {
            background: #4b5563;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>🔧 IPCore Tools Registry</h1>
        <div class="subtitle">Centralized catalog of team AI tools, scripts, and automation utilities</div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Search & Filter</h3>

            <div class="filter-section">
                <label>🔍 Search</label>
                <input type="text" id="searchInput" placeholder="Search tools...">
            </div>

            <div class="filter-section">
                <label>📂 Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="skill">Claude Skills</option>
                    <option value="mcp_server">MCP Servers</option>
                    <option value="n8n_workflow">n8n Workflows</option>
                    <option value="web_ui">Web UIs</option>
                    <option value="lab">Labs</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="filter-section">
                <label>🏷️ Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="filter-section">
                <label>💚 Status</label>
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="working">✅ Working</option>
                    <option value="untested">⚠️ Untested</option>
                    <option value="broken">❌ Broken</option>
                </select>
            </div>

            <div class="filter-section">
                <label>🏷️ Popular Tags</label>
                <div id="tagCloud" class="tag-cloud"></div>
            </div>

            <button id="submitToolBtn" class="btn-primary">+ Submit New Tool</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="stats-bar">
                <div>
                    <span id="toolCount">Loading...</span>
                </div>
                <div class="export-buttons">
                    <button class="btn-secondary" onclick="exportTools('json')">Export JSON</button>
                    <button class="btn-secondary" onclick="exportTools('csv')">Export CSV</button>
                    <button class="btn-secondary" onclick="syncTools()">🔄 Sync</button>
                </div>
            </div>

            <div id="toolGrid">
                <div class="loading">Loading tools...</div>
            </div>
        </div>
    </div>

    <!-- Submit Tool Modal -->
    <div id="submitModal" class="modal">
        <div class="modal-content">
            <h2>Submit New Tool</h2>
            <form id="submitForm">
                <div class="form-group">
                    <label>Tool Name *</label>
                    <input type="text" name="name" required placeholder="e.g., Junos Config Backup">
                </div>

                <div class="form-group">
                    <label>Description *</label>
                    <textarea name="description" required placeholder="What does this tool do?"></textarea>
                </div>

                <div class="form-group">
                    <label>Type *</label>
                    <select name="tool_type" required>
                        <option value="">Select Type...</option>
                        <option value="skill">Claude Skill</option>
                        <option value="mcp_server">MCP Server</option>
                        <option value="n8n_workflow">n8n Workflow</option>
                        <option value="web_ui">Web UI / App</option>
                        <option value="lab">Lab / Testbed</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Link / URL (optional)</label>
                    <input type="url" name="access_url" placeholder="https://github.com/...">
                </div>

                <div class="form-group">
                    <label>Tags (optional, comma-separated)</label>
                    <input type="text" name="tags" placeholder="juniper, backup, automation">
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-submit">Submit Tool</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        let allTools = [];
        let selectedTags = new Set();

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Load tools from API
        async function loadTools() {
            const params = new URLSearchParams();

            const search = document.getElementById('searchInput').value;
            if (search) params.append('search', search);

            const toolType = document.getElementById('typeFilter').value;
            if (toolType) params.append('tool_type', toolType);

            const category = document.getElementById('categoryFilter').value;
            if (category) params.append('category', category);

            const status = document.getElementById('statusFilter').value;
            if (status) params.append('status', status);

            if (selectedTags.size > 0) {
                params.append('tags', Array.from(selectedTags).join(','));
                params.append('tag_match', 'all');
            }

            try {
                const resp = await fetch(`/api/tools?${params}`);
                const data = await resp.json();
                allTools = data.tools;
                renderTools(allTools);
                updateToolCount(data.count);
            } catch (error) {
                console.error('Failed to load tools:', error);
                document.getElementById('toolGrid').innerHTML =
                    '<div class="empty-state"><h3>Failed to load tools</h3></div>';
            }
        }

        // Render tools grid
        function renderTools(tools) {
            const grid = document.getElementById('toolGrid');

            if (tools.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No tools found</h3>
                        <p>Try adjusting your filters or submit a new tool!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = tools.map(tool => {
                const categoryColors = {
                    'Network Automation': '#3b82f6',
                    'AI & LLM': '#8b5cf6',
                    'Workflows': '#06b6d4',
                    'Infrastructure': '#f59e0b',
                    'Governance': '#ec4899',
                    'Documentation': '#10b981',
                    'Testing & Quality': '#22c55e'
                };

                const statusClass = `status-${tool.status || 'untested'}`;
                const statusText = tool.status === 'working' ? '✅ Working' :
                                 tool.status === 'broken' ? '❌ Broken' :
                                 '⚠️ Untested';

                return `
                    <div class="tool-card">
                        <div>
                            <span class="tool-type-badge">${tool.tool_type.replace('_', ' ')}</span>
                            ${tool.category ? `<span class="category-tag" style="background: ${categoryColors[tool.category] || '#6b7280'}">${tool.category}</span>` : ''}
                        </div>

                        <h3>${tool.name}</h3>
                        <p class="tool-description">${tool.description}</p>

                        ${tool.tag_list && tool.tag_list.length > 0 ? `
                            <div class="tool-tags">
                                ${tool.tag_list.map(tag => `<span class="tool-tag">#${tag}</span>`).join('')}
                            </div>
                        ` : ''}

                        ${tool.access_url ? `<a href="${tool.access_url}" target="_blank" class="tool-link">Open Tool →</a>` : ''}

                        ${tool.screenshot_path ? `<img src="${tool.screenshot_path}" class="tool-screenshot" alt="Screenshot">` : ''}

                        <div class="tool-meta">
                            <span class="${statusClass} status-badge">${statusText}</span>
                            <span>Added ${new Date(tool.created_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update tool count
        function updateToolCount(count) {
            document.getElementById('toolCount').textContent = `${count} tool${count !== 1 ? 's' : ''}`;
        }

        // Load categories
        async function loadCategories() {
            try {
                const resp = await fetch('/api/tools/categories/all');
                const data = await resp.json();

                const categoryFilter = document.getElementById('categoryFilter');
                data.categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cat.icon} ${cat.name} (${cat.count})`;
                    categoryFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load categories:', error);
            }
        }

        // Load tags
        async function loadTags() {
            try {
                const resp = await fetch('/api/tools/tags/all');
                const data = await resp.json();

                const tagCloud = document.getElementById('tagCloud');
                const topTags = data.tags.slice(0, 15); // Show top 15 tags

                tagCloud.innerHTML = topTags.map(t => `
                    <span class="tag-chip" data-tag="${t.tag}">
                        #${t.tag} (${t.count})
                    </span>
                `).join('');

                // Add click handlers
                tagCloud.querySelectorAll('.tag-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const tag = chip.dataset.tag;
                        if (selectedTags.has(tag)) {
                            selectedTags.delete(tag);
                            chip.classList.remove('active');
                        } else {
                            selectedTags.add(tag);
                            chip.classList.add('active');
                        }
                        loadTools();
                    });
                });
            } catch (error) {
                console.error('Failed to load tags:', error);
            }
        }

        // Export tools
        async function exportTools(format) {
            window.open(`/api/tools/export?format=${format}`, '_blank');
        }

        // Sync tools (run crawlers)
        async function syncTools() {
            if (!confirm('Run auto-discovery crawlers? This may take a minute.')) return;

            try {
                const resp = await fetch('/api/tools/sync', { method: 'POST' });
                const data = await resp.json();
                alert(`Discovered ${JSON.stringify(data.summary)} tools!`);
                loadTools();
                loadTags();
            } catch (error) {
                alert('Sync failed: ' + error.message);
            }
        }

        // Modal handlers
        document.getElementById('submitToolBtn').addEventListener('click', () => {
            document.getElementById('submitModal').classList.add('active');
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('submitModal').classList.remove('active');
            document.getElementById('submitForm').reset();
        });

        // Submit form
        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const toolData = Object.fromEntries(formData);

            try {
                const resp = await fetch('/api/tools', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(toolData)
                });

                if (resp.ok) {
                    alert('Tool submitted successfully!');
                    document.getElementById('submitModal').classList.remove('active');
                    e.target.reset();
                    loadTools();
                    loadTags();
                } else {
                    alert('Failed to submit tool');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Event listeners for filters
        document.getElementById('searchInput').addEventListener('input', debounce(loadTools, 300));
        document.getElementById('typeFilter').addEventListener('change', loadTools);
        document.getElementById('categoryFilter').addEventListener('change', loadTools);
        document.getElementById('statusFilter').addEventListener('change', loadTools);

        // Initial load
        loadTools();
        loadCategories();
        loadTags();
    </script>
</body>
</html>
